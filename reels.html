<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pastry Culture | Reels TV</title>
<style>html,body{margin:0;width:100%;height:100%;background:#080e1d;overflow:hidden}video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#080e1d}#start{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#080e1d;color:#e8d6aa;font:24px system-ui;border:0;cursor:pointer}</style>
</head>
<body>
<video id="screen" autoplay muted playsinline preload="auto"></video>
<button id="start" type="button">▶ Start Pastry Culture Reels</button>
<script>
const files=['reel-1.mp4','reel-2.mp4','reel-3.mp4'];
const screen=document.getElementById('screen'),start=document.getElementById('start');let current=0;
function playCurrent(){screen.src=files[current];screen.load();const p=screen.play();if(p&&p.catch)p.catch(()=>{start.style.display='flex'});}
screen.addEventListener('ended',()=>{current=(current+1)%files.length;playCurrent()});
screen.addEventListener('error',()=>{start.style.display='flex';start.textContent='Tap to play / Check video files'});
start.addEventListener('click',()=>{start.style.display='none';screen.play().catch(()=>start.style.display='flex')});
playCurrent();
</script>
</body>
</html>
