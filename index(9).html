<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pastry Culture Menu</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f3efe3;
}
#menuVideo{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  object-fit:contain;
  background:#f3efe3;
}
#fullscreenBtn{
  position:fixed;
  right:24px;
  bottom:24px;
  z-index:10;
  padding:16px 22px;
  border:0;
  border-radius:12px;
  background:rgba(0,0,0,.72);
  color:#fff;
  font:600 20px Arial,sans-serif;
  cursor:pointer;
}
</style>
</head>
<body>
<video id="menuVideo" autoplay muted loop playsinline preload="auto">
  <source src="pastry-culture-menu-video-15s.mp4" type="video/mp4">
</video>

<button id="fullscreenBtn">FULL SCREEN</button>

<script>
const video = document.getElementById('menuVideo');
const button = document.getElementById('fullscreenBtn');

async function startVideo() {
  try {
    video.muted = true;
    await video.play();
  } catch (e) {}
}

button.addEventListener('click', async () => {
  await startVideo();

  try {
    if (video.requestFullscreen) {
      await video.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    } else if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    }
  } catch (e) {}

  button.style.display = 'none';
});

video.addEventListener('click', async () => {
  await startVideo();
});

startVideo();
</script>
</body>
</html>
